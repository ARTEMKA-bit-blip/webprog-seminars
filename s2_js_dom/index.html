<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Клуб програмування КК-КН</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header>
    <h1>Клуб програмування КК-КН</h1>
    <p>Вчимося разом: верстка, код і мініпроєкти</p>
  </header>
  <nav>
    <a href="#about">Про нас</a>
    <a href="#events">Зустрічі</a>
    <a href="#join">Запис</a>
  </nav>
  <main>
    <section id="about">
      <h2>Про нас</h2>
      <p>Ми вчимо HTML, CSS і JavaScript та разом робимо невеликі проєкти. Приходьте на зустрічі, навіть якщо ви тільки починаєте.</p>
    </section>
    <section id="events">
      <h2>Зустрічі</h2>
      <ul></ul>
      <button type="button" id="going-btn">Я піду</button>
      <span id="count">0</span>
    </section>
    <section id="join">
      <h2>Запис</h2>
      <button type="button" id="join-btn" class="btn">Записатись</button>
      <form id="join-form" class="hidden">
        <label for="name">Ім’я</label>
        <input id="name" name="name">
        <button type="submit">Надіслати</button>
      </form>
      <p id="message"></p>
    </section>
  </main>
  <footer>
    <p>Контакти: Telegram-канал клубу</p>
  </footer>
</body>
</html>
